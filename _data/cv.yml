- title: Projects
  type: time_table
  contents:
    - title: "TinyTorch: Custom C++/CUDA Deep Learning Framework"
      year: 2025 - 2026
      description:
        - Developed a C++ deep learning framework from scratch with Python bindings (pybind11), featuring a custom DAG-based autograd engine utilizing topological sort for backpropagation.
        - Engineered custom CUDA kernels for 2D Convolutions (forward and transposed backward passes), Linear layers, and GAP, utilizing shared memory tiling and 1D stride loops to manage memory coalescing.
        - Built a specialized, fused Softmax-Cross Entropy kernel that executed faster than PyTorch's generalized equivalent.
        - Trained a custom Conv-ReLU-Conv-Linear architecture on the MNIST dataset using a custom SGD optimizer and manual GPU memory management, achieving 95% test accuracy in 20 minutes.

    - title: "Generative AI: VAE & RealNVP"
      year: 2025
      description:
        - Implemented a Variational Autoencoder (VAE) to study latent variable models and probabilistic image generation.
        - Built a RealNVP flow-based model utilizing affine coupling layers for exact density estimation and efficient sampling.
        - Analyzed manifold learning and generative capabilities through latent space visualization and reconstruction metrics.

    - title: Self-Supervised Learning (DINOv1)
      year: 2024
      description:
        - Implemented the DINOv1 training pipeline for ResNet models, enabling self-supervised feature learning without labels.
        - Developed a finetuning pipeline to adapt the pre-trained model for classification tasks.
        - Utilized clear coding practices, allowing for seamless training of the model from the CLI without modifying code.

    - title: "Foundational CV Architectures: ViT & ResNet"
      year: 2024
      description:
        - Implemented Vision Transformer (ViT) and ResNet (50, 101, 152) architectures from scratch in PyTorch, adhering to original research specifications.
        - Engineered core components including multi-head self-attention, positional encoding, patch embeddings, and residual skip connections.
        - Validated models on PascalVOC2012 and CardDataset, achieving 70.66% and 88.44% accuracy respectively without pre-training or hyperparameter tuning.

